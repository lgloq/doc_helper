name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 lint 工具
        run: pip install "ruff>=0.8,<1.0"

      - name: Ruff 代码检查
        run: |
          ruff check \
            backend/app/api/routes/documents.py \
            backend/app/core/config.py \
            backend/app/main.py \
            backend/app/schemas/document.py \
            backend/app/services/llm/openai_compatible.py \
            backend/app/services/observability/langfuse_adapter.py \
            backend/app/services/ingestion/async_service.py \
            backend/app/workers/settings.py \
            backend/app/workers/tasks.py \
            backend/app/tests/test_async_ingest.py \
            backend/app/tests/test_langfuse_adapter.py

      - name: Ruff 格式检查
        run: |
          ruff format --check \
            backend/app/api/routes/documents.py \
            backend/app/core/config.py \
            backend/app/main.py \
            backend/app/schemas/document.py \
            backend/app/services/llm/openai_compatible.py \
            backend/app/services/observability/langfuse_adapter.py \
            backend/app/services/ingestion/async_service.py \
            backend/app/workers/settings.py \
            backend/app/workers/tasks.py \
            backend/app/tests/test_async_ingest.py \
            backend/app/tests/test_langfuse_adapter.py

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行测试
        working-directory: backend
        run: python -m pytest -v --tb=short

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: frontend
        run: npm install

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -f backend/Dockerfile -t eka-backend:test .

      - name: 构建前端镜像
        run: docker build -f frontend/Dockerfile -t eka-frontend:test .
