[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant-backend"
version = "0.1.0"
description = "Backend for the permission-aware RAG enterprise document knowledge assistant MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.51,<2.0",
  "pdfplumber>=0.11,<1.0",
  "pgvector>=0.3,<1.0",
  "pillow>=10.4,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymupdf>=1.24,<2.0",
  "PyJWT>=2.9,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pypdf>=5.1,<6.0",
  "pytest>=8.2,<9.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "pytesseract>=0.3.13,<0.4",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

